# Jekyll configuration for GitHub Pages
title: Pipeline Diagrams
description: Whiteboard-proof diagrams for data pipelines
baseurl: ""
url: "https://pipeline-diagrams.com"

# Build settings
markdown: kramdown
highlighter: rouge
theme: just-the-docs
color_scheme: pipeline

# Include/exclude files
exclude:
  - readme.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - package.json
  - action.yml
  - integrations/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections_dir: .

# Default layouts
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

aux_links:
  npm: https://www.npmjs.com/package/pipeline-diagrams
  GitHub: https://github.com/sparkboxx/pipeline-modelling

# Theme options
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/sparkboxx/pipeline-modelling"
gh_edit_branch: "master"
gh_edit_view_mode: "tree"

callouts:
  origin:
    title: Origin of the symbol
    color: purple
